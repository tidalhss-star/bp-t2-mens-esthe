<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="139" cy="638" r="99" fill="#a0522d" opacity="0.11"/>
    <circle cx="883" cy="385" r="39" fill="#a0522d" opacity="0.07"/>
    <circle cx="496" cy="623" r="59" fill="#a0522d" opacity="0.17"/>
    <circle cx="972" cy="233" r="83" fill="#a0522d" opacity="0.08"/>
    <circle cx="1214" cy="-77" r="45" fill="#a0522d" opacity="0.15"/>
    <circle cx="741" cy="473" r="94" fill="#a0522d" opacity="0.19"/>
    <rect x="886" y="229" width="43" height="54" rx="8" fill="#8b4513" opacity="0.08" transform="rotate(3, 830, -38)"/>
    <rect x="464" y="453" width="66" height="21" rx="8" fill="#8b4513" opacity="0.12" transform="rotate(19, -98, 516)"/>
    <rect x="37" y="447" width="97" height="73" rx="8" fill="#8b4513" opacity="0.13" transform="rotate(16, 1010, 56)"/>
    <rect x="629" y="35" width="78" height="90" rx="8" fill="#8b4513" opacity="0.03" transform="rotate(17, 340, -61)"/>
    <rect x="398" y="475" width="57" height="74" rx="8" fill="#8b4513" opacity="0.13" transform="rotate(1, 331, 91)"/>
    <rect x="409" y="723" width="29" height="78" rx="8" fill="#8b4513" opacity="0.07" transform="rotate(26, 378, 401)"/>
    <rect x="1131" y="343" width="47" height="41" rx="8" fill="#8b4513" opacity="0.08" transform="rotate(21, 381, 196)"/>
    <rect x="355" y="-42" width="74" height="72" rx="8" fill="#8b4513" opacity="0.07" transform="rotate(31, 634, 430)"/>
    <polygon points="939,352 993,460 885,460" fill="#a0522d" opacity="0.12"/>
    <polygon points="179,450 210,512 148,512" fill="#a0522d" opacity="0.09"/>
    <polygon points="1158,140 1201,226 1115,226" fill="#a0522d" opacity="0.07"/>
    <polygon points="643,609 664,651 622,651" fill="#a0522d" opacity="0.11"/>

  <!-- Wave at bottom -->
  <path d="M0,564 C360,597 840,531 1200,564 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 럭셔리 단체 가라오케 예약 가이드
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — VIP 단체 모임
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     마포 럭셔리 단체 가라오케 예약 가이드 — VIP 단체 모임
  </text>
</svg>